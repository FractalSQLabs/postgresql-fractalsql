name: Release fractalsql-postgresql Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# contents: write is granted per-job below (package/build-darwin/build-
# windows-msi, the three that call softprops/action-gh-release to upload
# assets), not here at workflow level -- build doesn't touch the release
# at all and doesn't need it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One build cell per {PG major, arch}. Each cell produces a single
  # fractalsql_pg${VER}.so, validates it in-container, and (amd64 only)
  # runs a smoke test inside a real postgres:${VER} image.
  build:
    name: build pg${{ matrix.pg }} / ${{ matrix.arch }}
    # Native arm64 via GitHub's ubuntu-24.04-arm runner. Earlier
    # iterations used ubuntu-latest + QEMU, which paid the cost of
    # x86->aarch64 instruction translation for every build cell.
    # With 5 PG majors × 2 archs = 10 cells, the saved minutes add up.
    # Native arm64 runners (GA mid-2025) run the same Docker + buildx
    # stack at native speed; no QEMU shim needed.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg:   [14, 15, 16, 17, 18]
        arch: [amd64, arm64]
        # The `include` entries match the existing arch axis and
        # fan runner across every (pg, arch) cell automatically.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build fractalsql_pg${{ matrix.pg }}.so for ${{ matrix.arch }}
        run: |
          mkdir -p "dist/${{ matrix.arch }}"
          DOCKER_BUILDKIT=1 docker buildx build \
              --platform "linux/${{ matrix.arch }}" \
              --target "export-pg${{ matrix.pg }}" \
              --output "type=local,dest=dist/${{ matrix.arch }}" \
              -f docker/Dockerfile \
              .
          ls -l "dist/${{ matrix.arch }}/fractalsql_pg${{ matrix.pg }}.so"

      # amd64 only — native smoke test inside a real postgres container.
      # arm64 is covered implicitly: if the link step inside the arm64
      # build stage succeeded, PG_MODULE_MAGIC and the .dynsym exports
      # are correct for that architecture.
      - name: Smoke test (CREATE EXTENSION + version/edition + search)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          PG_VER=${{ matrix.pg }}
          SO="dist/amd64/fractalsql_pg${PG_VER}.so"

          docker run -d --name pg \
              -e POSTGRES_PASSWORD=test \
              -e POSTGRES_HOST_AUTH_METHOD=trust \
              "postgres:${PG_VER}-bookworm"

          # Wait for the server to accept connections. 60s budget, not 30 --
          # a cold image pull (first run on a fresh runner, or a new PG
          # major never pulled before) leaves disk I/O contended right as
          # the container starts, and initdb + first boot can occasionally
          # miss a tighter window. Dump the container's own log on failure
          # so a real startup problem is diagnosable instead of just
          # "rejecting connections" with no further context.
          ready=0
          for i in $(seq 1 60); do
              if docker exec pg pg_isready -U postgres >/dev/null 2>&1; then
                  ready=1
                  break
              fi
              sleep 1
          done
          if [ "$ready" -ne 1 ]; then
              echo "::group::postgres container log (server never became ready)"
              docker logs pg || true
              echo "::endgroup::"
          fi
          docker exec pg pg_isready -U postgres

          docker cp "${SO}" \
              "pg:/usr/lib/postgresql/${PG_VER}/lib/fractalsql.so"
          docker cp fractalsql.control \
              "pg:/usr/share/postgresql/${PG_VER}/extension/fractalsql.control"
          docker cp sql/fractalsql--1.0.sql \
              "pg:/usr/share/postgresql/${PG_VER}/extension/fractalsql--1.0.sql"

          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION fractalsql;"

          # Dependent fractalsql_agents extension (pure PL/pgSQL,
          # requires='fractalsql'). Stage its .control + install SQL and
          # CREATE EXTENSION it to exercise the requires gate end-to-end.
          docker cp fractalsql_agents/fractalsql_agents.control \
              "pg:/usr/share/postgresql/${PG_VER}/extension/fractalsql_agents.control"
          docker cp fractalsql_agents/sql/fractalsql_agents--1.0.sql \
              "pg:/usr/share/postgresql/${PG_VER}/extension/fractalsql_agents--1.0.sql"
          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION fractalsql_agents;"
          AGENTS_VER=$(docker exec pg psql -U postgres -tAc \
              "SELECT extversion FROM pg_extension WHERE extname='fractalsql_agents';")
          echo "agents extversion: ${AGENTS_VER}"
          test "${AGENTS_VER}" = "1.0"

          EDITION=$(docker exec pg psql -U postgres -tAc \
              "SELECT fractal_edition();")
          echo "edition: ${EDITION}"
          test "${EDITION}" = "Community"

          VERSION=$(docker exec pg psql -U postgres -tAc \
              "SELECT fractal_version();")
          echo "version: ${VERSION}"
          test "${VERSION}" = "2.0.11"

          # Convergence sanity check: query = (0.6, 0.8), objective is
          # cosine distance. Cosine distance is magnitude-invariant,
          # so every point on the ray through the origin and (0.6, 0.8)
          # is a global optimum — the coordinates SFS returns can land
          # anywhere along that ray inside [-1, 1]^2. We assert the
          # invariant the optimizer is actually minimizing: cosine
          # similarity to the query should be essentially 1.
          # ||query||² = 0.6²+0.8² = 1, so cos_sim simplifies to
          # (v·query) / ||v||.
          RESULT=$(docker exec pg psql -U postgres -tAc "
              WITH r AS (
                  SELECT fractal_search(
                      ARRAY[0.6, 0.8]::float8[], 100, 50, 2
                  ) AS v
              )
              SELECT CASE
                  WHEN sqrt(v[1]*v[1] + v[2]*v[2]) > 1e-9
                   AND (v[1]*0.6 + v[2]*0.8)
                       / sqrt(v[1]*v[1] + v[2]*v[2]) > 0.99
                  THEN 'ok'
                  ELSE format('FAIL v=%s', v)
              END
              FROM r;")
          echo "convergence: ${RESULT}"
          test "${RESULT}" = "ok"

          docker rm -f pg

      - name: Upload .so artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fractalsql-pg${{ matrix.pg }}-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}/fractalsql_pg${{ matrix.pg }}.so
          if-no-files-found: error

  # One packaging cell per arch. Collects all three per-major .so's
  # for this arch from the build jobs above, then runs package.sh to
  # produce 3x{.deb, .rpm}.
  package:
    name: package ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download pg14 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: fractalsql-pg14-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}

      - name: Download pg15 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: fractalsql-pg15-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}

      - name: Download pg16 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: fractalsql-pg16-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}

      - name: Download pg17 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: fractalsql-pg17-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}

      - name: Download pg18 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: fractalsql-pg18-${{ matrix.arch }}-so
          path: dist/${{ matrix.arch }}

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm for ${{ matrix.arch }}
        run: |
          chmod +x package.sh
          ./package.sh ${{ matrix.arch }}
          ls -l dist/packages

      # easy_install.sh is arch-independent (pure bash), so stamp it once
      # from the amd64 leg only, not once per matrix arch. Uploading the
      # identical file from both the amd64 and arm64 package jobs would
      # race two concurrent release-asset uploads of the same name.
      - name: Stamp version into easy_install.sh
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              FSQL_VERSION="${{ github.ref_name }}"
              FSQL_VERSION="${FSQL_VERSION#v}"
          else
              FSQL_VERSION="$(sed -n 's/^#define FSQL_VERSION "\(.*\)"$/\1/p' src/fractalsql.c)"
          fi
          sed "s/@@FSQL_VERSION@@/${FSQL_VERSION}/" scripts/easy_install.sh > dist/packages/easy_install.sh
          chmod +x dist/packages/easy_install.sh

      # Verify no luajit runtime dep leaked into the package metadata.
      - name: Verify packages declare no luajit dependency
        run: |
          set -euo pipefail
          for deb in dist/packages/*-${{ matrix.arch }}.deb; do
              echo "=== ${deb} ==="
              DEPS=$(dpkg-deb -f "${deb}" Depends)
              echo "Depends: ${DEPS}"
              if echo "${DEPS}" | grep -iE 'luajit'; then
                  echo "FAIL: ${deb} declares a luajit dependency" >&2
                  exit 1
              fi
          done
          for rpm in dist/packages/*-${{ matrix.arch }}.rpm; do
              echo "=== ${rpm} ==="
              REQS=$(rpm -qpR "${rpm}" || true)
              echo "Requires:"
              echo "${REQS}"
              if echo "${REQS}" | grep -iE '^luajit'; then
                  echo "FAIL: ${rpm} declares a luajit requirement" >&2
                  exit 1
              fi
          done

      - name: Verify extension files land at the right per-distro paths
        run: |
          # PostgreSQL extensions live in different trees on Debian
          # (apt postgresql-<ver>) vs RHEL PGDG (yum postgresql<ver>-server).
          # The .so + .control + .sql trio must land where the running
          # server looks, or CREATE EXTENSION fails with
          # "could not open extension control file".
          #
          #   Debian: /usr/lib/postgresql/<ver>/lib/,
          #           /usr/share/postgresql/<ver>/extension/
          #   RHEL:   /usr/pgsql-<ver>/lib/,
          #           /usr/pgsql-<ver>/share/extension/
          set -euo pipefail
          for deb in dist/packages/*-${{ matrix.arch }}.deb; do
              echo "=== ${deb} ==="
              CONTENTS=$(dpkg-deb -c "${deb}")
              echo "${CONTENTS}" | grep -E 'usr/lib/postgresql/[0-9]+/lib/fractalsql\.so$'
              echo "${CONTENTS}" | grep -E 'usr/lib/postgresql/[0-9]+/lib/fractalsql-reasoning-http\.so$'
              echo "${CONTENTS}" | grep -E 'usr/share/postgresql/[0-9]+/extension/fractalsql\.control$'
              echo "${CONTENTS}" | grep -E 'usr/share/postgresql/[0-9]+/extension/fractalsql--1\.0\.sql$'
              echo "${CONTENTS}" | grep -E 'usr/share/postgresql/[0-9]+/extension/fractalsql_agents\.control$'
              echo "${CONTENTS}" | grep -E 'usr/share/postgresql/[0-9]+/extension/fractalsql_agents--1\.0\.sql$'
          done
          for rpm in dist/packages/*-${{ matrix.arch }}.rpm; do
              echo "=== ${rpm} ==="
              CONTENTS=$(rpm -qlp "${rpm}")
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/lib/fractalsql\.so$'
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/lib/fractalsql-reasoning-http\.so$'
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/share/extension/fractalsql\.control$'
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/share/extension/fractalsql--1\.0\.sql$'
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/share/extension/fractalsql_agents\.control$'
              echo "${CONTENTS}" | grep -E '/usr/pgsql-[0-9]+/share/extension/fractalsql_agents--1\.0\.sql$'
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fractalsql-postgresql-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/packages/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # macOS: fractalsql.dylib for each PG major × (Intel, Apple Silicon).
  # Homebrew's `postgresql@<MAJOR>` formulas provide per-major headers
  # (`pg_config --includedir-server`). Install the one we want per
  # matrix cell, build, verify, package.
  #
  # Installation is user-driven: PG's extension tree on macOS depends
  # on whether you installed from Homebrew (/opt/homebrew/opt/postgresql@X/)
  # or Postgres.app (/Applications/Postgres.app/Contents/Versions/X/).
  # We ship .dylib + .control + .sql + README; users `cp` to the
  # right tree.
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # macOS: per-(major, arch) tarball. Pure-C — builds the extension with
  # PGXS against a Homebrew PostgreSQL, linking the vendored darwin core
  # archive (include/darwin-<arch>/), and bundles the reasoning plugin +
  # install.sh. arm64 native; x86_64 cross-compiled via -arch on Apple
  # Silicon (the free Intel macos-13 runner was retired Dec 2025).
  # ------------------------------------------------------------------
  build-darwin:
    name: darwin pg${{ matrix.pg }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        arch: [arm64, x86_64]
    runs-on: macos-14
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install PostgreSQL ${{ matrix.pg }} (Homebrew)
        run: |
          set -euo pipefail
          brew install postgresql@${{ matrix.pg }}
          echo "$(brew --prefix postgresql@${{ matrix.pg }})/bin" >> "$GITHUB_PATH"

      - name: Build + package tarball (links vendored pure-C core)
        env:
          FSQL_DARWIN_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-darwin.sh scripts/macos/install.sh
          PG_CONFIG="$(brew --prefix postgresql@${{ matrix.pg }})/bin/pg_config" \
            ./scripts/package-darwin.sh
          ls -l dist/packages
          # Verify the dependent agents extension (platform-independent
          # PL/pgSQL) is bundled in the tarball alongside the base files —
          # mirrors the per-distro package-content checks on Linux.
          # Same derivation as package-darwin.sh's own VERSION (FSQL_VERSION
          # in src/fractalsql.c) so this never hardcodes a version that can
          # drift out of sync with what was actually just built.
          FSQL_VERSION="$(sed -n 's/^#define FSQL_VERSION "\(.*\)"$/\1/p' src/fractalsql.c)"
          TARBALL="dist/packages/fractalsql-postgresql-${FSQL_VERSION}-pg${{ matrix.pg }}-darwin-${{ matrix.arch }}.tar.gz"
          tar -tzf "$TARBALL" | grep -E 'fractalsql_agents\.control$'
          tar -tzf "$TARBALL" | grep -E 'fractalsql_agents--1\.0\.sql$'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fractalsql-postgresql-pg${{ matrix.pg }}-darwin-${{ matrix.arch }}
          path: dist/packages/*-pg${{ matrix.pg }}-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/packages/*-pg${{ matrix.pg }}-darwin-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Windows: fractalsql.dll + FractalSQL-PostgreSQL-<NN>-<VER>-x64.msi
  #
  # Matrix — x64 only.
  #   x86   : EDB hasn't shipped a 32-bit Windows PG installer since
  #           PG 11, so there's no host server for a 32-bit DLL.
  #   arm64 : EDB publishes Windows ARM64 PG as an .exe BitRock
  #           installer only — there is no "-binaries.zip" variant.
  #           Silent-extracting the .exe to harvest postgres.lib +
  #           server headers is possible but non-trivial; deferring
  #           arm64 Windows until a post-v2.0.0 iteration.
  #   x64   : full coverage for PG 14-18 via EDB's published
  #           postgresql-<VER>-<ITER>-windows-x64-binaries.zip.
  #
  # Each cell:
  #   1. Pulls EDB's per-PG "binaries" .zip from get.enterprisedb.com
  #      — includes include\server\ and lib\postgres.lib.
  #   2. Runs scripts\windows\build-windows.ps1 to produce fractalsql.dll
  #      against that PG major's server headers (/MT /GL static CRT,
  #      statically linking the vendored pure-C core archive from
  #      include\windows-x86_64\ — no LuaJIT anywhere in this path;
  #      that's scripts\windows\build.bat, kept only for the LuaJIT
  #      parity oracle, not used for release binaries).
  #   3. Asserts dumpbin /dependents shows no MSVC redistributable
  #      imports and no dynamic lua51.dll (build-windows.ps1 runs its
  #      own export/dependency audit too; this is a second, stricter
  #      check that treats a dynamic CRT as fatal, not just a warning).
  #   4. Runs scripts\windows\build-msi.bat to produce one MSI
  #      named FractalSQL-PostgreSQL-<PG_MAJOR>-<MSI_VERSION>-x64.msi.
  # ------------------------------------------------------------------
  build-windows-msi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: 14
            arch: x64
            runner: windows-latest
            edb_version: "14.13-1"
          - pg: 15
            arch: x64
            runner: windows-latest
            edb_version: "15.8-1"
          - pg: 16
            arch: x64
            runner: windows-latest
            edb_version: "16.4-1"
          - pg: 17
            arch: x64
            runner: windows-latest
            edb_version: "17.0-1"
          - pg: 18
            arch: x64
            runner: windows-latest
            edb_version: "18.0-1"
    runs-on: ${{ matrix.runner }}
    name: windows pg${{ matrix.pg }} / ${{ matrix.arch }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up MSVC dev cmd (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install WiX Toolset (provides candle.exe + light.exe)
        shell: pwsh
        run: |
          choco install -y --no-progress wixtoolset

          # On the x64 runner, choco shims candle/light into
          # C:\ProgramData\chocolatey\bin automatically. On the
          # windows-11-arm runner it doesn't — append the WiX bin dir
          # to $GITHUB_PATH explicitly so later steps find candle.exe.
          $wixBin = $null
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "candle.exe")) { $wixBin = $c; break }
          }
          if (-not $wixBin) {
            Write-Host "Searching under Program Files for candle.exe..."
            $hit = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" `
                     -Recurse -Filter "candle.exe" -ErrorAction SilentlyContinue `
                   | Select-Object -First 1
            if ($hit) { $wixBin = $hit.DirectoryName }
          }
          if (-not $wixBin) {
            Write-Host "FATAL: candle.exe not found after choco install wixtoolset"
            exit 1
          }
          Write-Host "WiX bin dir: $wixBin"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Download + unpack EDB PostgreSQL ${{ matrix.edb_version }} ${{ matrix.arch }} binaries
        shell: pwsh
        env:
          EDB_VERSION: ${{ matrix.edb_version }}
          PG_ARCH:     ${{ matrix.arch }}
        run: |
          # EDB publishes per-(version, arch) "binaries" zips that
          # contain a full pgsql\ tree (bin\, lib\, include\server\)
          # without the interactive installer wrapper. This is what
          # we need for cross-compiling an extension.
          $zipName = "postgresql-${env:EDB_VERSION}-windows-${env:PG_ARCH}-binaries.zip"
          $url     = "https://get.enterprisedb.com/postgresql/$zipName"
          Write-Host "Fetching $url"
          New-Item -ItemType Directory -Force -Path deps\pg | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "deps\pg\edb.zip" -UseBasicParsing
          Expand-Archive -Path "deps\pg\edb.zip" -DestinationPath "deps\pg" -Force

          # The zip unpacks into deps\pg\pgsql\ — normalize to
          # deps\pg\root so build-windows.ps1's -PgDir is consistent.
          if (Test-Path "deps\pg\pgsql") {
            Rename-Item -Path "deps\pg\pgsql" -NewName "root"
          } else {
            Write-Host "FATAL: expected deps\pg\pgsql\ inside $zipName"
            Get-ChildItem deps\pg -Recurse -Depth 2 | Format-Table
            exit 1
          }
          Test-Path "deps\pg\root\include\server\postgres.h"
          Test-Path "deps\pg\root\lib\postgres.lib"

      - name: Build fractalsql.dll (/MT static CRT, /GL WPO, PG ${{ matrix.pg }}, pure-C vendored core)
        shell: pwsh
        run: |
          .\scripts\windows\build-windows.ps1 -PgDir "deps\pg\root" -PgMajor ${{ matrix.pg }}
          Get-Item "dist\windows\pg${{ matrix.pg }}\fractalsql.dll"

      - name: Smoke-check fractalsql.dll dependencies (dumpbin)
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          $dll = "dist\windows\pg${env:PG_MAJOR}\fractalsql.dll"
          $deps = dumpbin /dependents $dll
          Write-Host ($deps -join "`n")
          if ($deps -match 'vcruntime|msvcp140|msvcr\d') {
              Write-Host '==> FAIL: .dll depends on MSVC redistributable DLLs'
              exit 1
          }
          if ($deps -match 'lua51\.dll|libluajit') {
              Write-Host '==> FAIL: .dll depends on a dynamic LuaJIT'
              exit 1
          }
          Write-Host '==> OK: static CRT, no LuaJIT (pure-C vendored core)'

      # Pins the MSI's Product Version to the release tag on a
      # tag-triggered run (e.g. refs/tags/v2.0.0 -> 2.0.0), so the
      # shipped MSI's version can't silently drift from what's actually
      # being released. On a workflow_dispatch test run (no tag), this
      # step is skipped and build-msi.bat falls back to its own default.
      - name: Compute MSI_VERSION from the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".Substring(1)
          Add-Content -Path $env:GITHUB_ENV -Value "MSI_VERSION=$ver"

      - name: Build MSI (candle + light, PG ${{ matrix.pg }} / ${{ matrix.arch }})
        shell: cmd
        env:
          PG_MAJOR: ${{ matrix.pg }}
          MSI_ARCH: ${{ matrix.arch }}
        run: |
          call scripts\windows\build-msi.bat
          if errorlevel 1 exit /b 1
          dir dist\windows\*.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fractalsql-postgresql-windows-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: dist/windows/FractalSQL-PostgreSQL-${{ matrix.pg }}-*-${{ matrix.arch }}.msi
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/windows/FractalSQL-PostgreSQL-${{ matrix.pg }}-*-${{ matrix.arch }}.msi
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # easy_install.ps1 is PG-major-independent (it detects installs at
      # runtime), so stamp and upload it from one matrix cell only (pg 14,
      # arbitrary but stable), not once per (pg, arch) cell, to avoid
      # five concurrent jobs racing an upload of the same release asset.
      - name: Stamp version into easy_install.ps1
        if: matrix.pg == 14
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".Substring(1)
          } else {
            $m = Select-String -Path src\fractalsql.c -Pattern '^#define FSQL_VERSION "(.*)"$' | Select-Object -First 1
            $ver = $m.Matches[0].Groups[1].Value
          }
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          (Get-Content scripts\windows\easy_install.ps1 -Raw) -replace '@@FSQL_VERSION@@', $ver | Set-Content -Path dist\windows\easy_install.ps1 -Encoding utf8

      - name: Upload easy_install.ps1 artifact
        if: matrix.pg == 14
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fractalsql-postgresql-easy-install-ps1
          path: dist/windows/easy_install.ps1
          if-no-files-found: error

      - name: Upload easy_install.ps1 to Release
        if: matrix.pg == 14 && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/windows/easy_install.ps1
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
